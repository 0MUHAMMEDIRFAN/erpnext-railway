name: Build and publish ERPNext

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: erpnext-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erpnext-railway" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .erpnext.ref versions.json)-hrms-$(jq -r .hrms.ref versions.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=erpnext-amd64
          cache-to: type=gha,scope=erpnext-amd64,mode=min
          secrets: |
            app_git_token=${{ secrets.APP_GIT_TOKEN }}
      - name: Test fresh install and restart
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: bash script/smoke-test.sh "$IMAGE"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        env:
          NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          image="$NAME:sha-$GITHUB_SHA"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          docker tag "$image" "$NAME:$VERSION"
          docker push "$NAME:$VERSION"
          docker tag "$image" "$NAME:latest"
          docker push "$NAME:latest"
          printf 'Deploy `%s`\n\nDigest `%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
